[project]
name = "lafrangine-api"
version = "1.0.0"
description = "API FastAPI de La Frangine — plateforme d'accompagnement des initiatives (refonte du site PHP legacy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.17",
    "pillow>=11.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP046"]  # UP046 : génériques Pydantic (Liste[T]) gardés en Generic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
